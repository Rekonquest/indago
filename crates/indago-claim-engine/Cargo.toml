[package]
name = "indago-claim-engine"
description = "Indago claim engine — deterministic claim lifecycle. Dedupes proposed claims by (subject, predicate, object), counts independent sources, auto-promotes Asserted -> Corroborated, and emits accepted claims. No LLM."
